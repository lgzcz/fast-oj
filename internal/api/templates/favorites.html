{{define "content"}}
<h1>我的收藏</h1>
<p class="meta">收藏是私人的；题目被藏起来后仍留在这里，但点进去照常按题目可见性判定。</p>

<div class="table-scroll" role="region" aria-label="收藏的题目" tabindex="0">
<table>
  <tr><th>题目</th><th>难度</th><th>标签</th><th>状态</th></tr>
  {{range .Data.Rows}}
  <tr>
    <td><a href="/problems/{{.PID}}">{{.PID}}</a>　{{.Title}}{{if .Hidden}} <span class="hidden">未公开</span>{{end}}</td>
    <td>{{.Difficulty}}</td>
    <td>{{range .Tags}}<span class="badge">{{.}}</span> {{end}}</td>
    <td><span class="status {{.StatusClass}}">{{.StatusText}}</span></td>
  </tr>
  {{else}}
  <tr><td colspan="4">还没有收藏。题目页右上角有「收藏」。</td></tr>
  {{end}}
</table>
</div>
{{end}}
