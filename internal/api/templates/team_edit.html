{{define "content"}}
<h1>{{if .Data.IsNew}}新建团队{{else}}团队设置{{end}}</h1>
<p class="meta">团队名不区分大小写，站内唯一。加入码留空 = 任何人都能直接加入。</p>

{{if .Data.Errors}}
<div class="flash">
  {{range .Data.Errors}}<p>{{.}}</p>{{end}}
</div>
{{end}}

<form method="post" action="{{.Data.Action}}">
  <input type="hidden" name="csrf" value="{{.Me.CSRF}}">

  <label>团队名</label>
  <input type="text" name="name" value="{{.Data.Name}}" maxlength="60" required>

  <div class="row">
    <div style="flex:1 1 18rem">
      <label>加入码（留空 = 公开团队）</label>
      <input type="text" name="join_code" value="{{.Data.JoinCode}}" maxlength="32"
             autocomplete="off" spellcheck="false" placeholder="只有字母数字和 -">
    </div>
    <button type="submit" name="newcode" value="1">随机生成</button>
  </div>

  <label>简介</label>
  <textarea name="intro" rows="10" maxlength="5000" spellcheck="false"
            placeholder="团队在做什么、招什么样的人、题库怎么用……">{{.Data.Intro}}</textarea>

  <p><input type="submit" value="{{if .Data.IsNew}}创建{{else}}保存{{end}}">
    {{if not .Data.IsNew}}<a href="/teams/{{.Data.ID}}">回到团队</a>{{end}}</p>
</form>

{{if not .Data.IsNew}}
<form method="post" action="/teams/{{.Data.ID}}/delete"
      onsubmit="return confirm('删掉这个团队？成员关系与团队题库会一起没掉，题目与提交不受影响。')">
  <input type="hidden" name="csrf" value="{{.Me.CSRF}}">
  <button type="submit" class="danger">删除团队</button>
</form>
{{end}}
{{end}}
